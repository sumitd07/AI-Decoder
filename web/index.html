<style>
  :root{
    --font-fallback:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-primary:"Inter",var(--font-fallback);
    --font-secondary:"Newsreader",var(--font-fallback);
    --font-body:var(--font-primary);
  }
  html,body{margin:0;padding:0}
  body{background:#fdfdfc;font-family:var(--font-body);-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
  *{box-sizing:border-box}
  a{color:var(--accent);text-decoration:none;cursor:pointer}
  a:hover{opacity:.72}
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid rgba(79,119,166,.45);outline-offset:2px}
  .dsp{font-family:var(--font-secondary)}

  @keyframes bd{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes sl{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translate(-50%,8px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
  @keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes cardin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes pulsering{0%,100%{transform:scale(.7);opacity:0}50%{transform:scale(1);opacity:1}}
  @keyframes savepop{0%{transform:scale(.4);opacity:0}55%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
  @keyframes heroin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  /* Decode box (Explain This, surface 1a).
   Press feedback: the button must feel like it heard the click. Gated behind
   hover:hover so a tap on touch doesn't leave it stuck in the pressed state. */
.h-decode:not(:disabled):active{ transform:scale(.97); }
@media (hover:hover) and (pointer:fine){ .h-decode:not(:disabled):hover{ opacity:.92; } }
/* The answer arrives rather than blinking in. ease-out so the movement is visible
   immediately — the moment the reader is watching. */
.explain-answer{ animation:explainIn 260ms cubic-bezier(0.23,1,0.32,1) both; }
@keyframes explainIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
/* Chips are decorative on arrival; stagger is short so nothing feels delayed. */
.explain-answer .rel{ animation:explainIn 220ms cubic-bezier(0.23,1,0.32,1) both; transition:border-color 150ms ease,background 150ms ease,transform 150ms cubic-bezier(0.23,1,0.32,1); }
.explain-answer .rel:nth-child(1){ animation-delay:60ms } .explain-answer .rel:nth-child(2){ animation-delay:100ms }
.explain-answer .rel:nth-child(3){ animation-delay:140ms } .explain-answer .rel:nth-child(4){ animation-delay:180ms }
.explain-answer .rel:nth-child(5){ animation-delay:220ms }
.explain-answer .rel:active{ transform:scale(.97); }
@media (hover:hover) and (pointer:fine){ .explain-answer .rel:hover{ border-color:var(--border-3); background:var(--surface-2); } }
@media (prefers-reduced-motion:reduce){
  .explain-answer, .explain-answer .rel{ animation:none; }
  .h-decode:not(:disabled):active{ transform:none; }
}
/* "How it works" — the extension's surface (1b), shown live on a sample article.
   Same motion language as the Decode box above, because it is the same feature
   seen twice: 0.23,1,0.32,1 entrances, a 60/40ms chip stagger, scale(.97) on
   press, hover behind a fine pointer. */
.demo-doc{ user-select:text; -webkit-user-select:text; }
.demo-doc p{ margin:0 0 15px; }
.demo-doc p:last-child{ margin-bottom:0; }
.demo-pill{
  position:absolute; z-index:40; transform:translateX(-50%); transform-origin:top center;
  display:inline-flex; align-items:center; gap:6px; padding:7px 14px;
  background:var(--surface); color:var(--accent); border:1px solid var(--border-2);
  border-radius:999px; font-family:var(--font-primary); font-size:12.5px; font-weight:600;
  line-height:1; cursor:pointer; box-shadow:0 6px 20px var(--shadow-soft);
  animation:demoPill 140ms cubic-bezier(0.23,1,0.32,1) backwards;
  transition:transform 140ms cubic-bezier(0.23,1,0.32,1), box-shadow 140ms ease;
}
.demo-pill[data-side="above"]{ transform-origin:bottom center; }
.demo-pill:active{ transform:translateX(-50%) scale(.97); }
@media (hover:hover) and (pointer:fine){ .demo-pill:hover{ box-shadow:0 8px 24px var(--shadow-strong); } }
@keyframes demoPill{ from{ opacity:0; transform:translateX(-50%) scale(.96); } to{ opacity:1; transform:translateX(-50%) scale(1); } }
.demo-panel{
  position:absolute; z-index:41; transform:translateX(-50%); transform-origin:top center;
  width:340px; max-width:calc(100% - 24px);
  background:var(--surface); color:var(--text); border:1px solid var(--border-2);
  border-radius:12px; box-shadow:0 12px 36px var(--shadow-strong); overflow:hidden;
  animation:demoPanel 200ms cubic-bezier(0.23,1,0.32,1) backwards;
}
.demo-panel[data-side="above"]{ transform-origin:bottom center; }
@keyframes demoPanel{ from{ opacity:0; transform:translateX(-50%) translateY(6px); } to{ opacity:1; transform:translateX(-50%) translateY(0); } }
.demo-head{ display:flex; align-items:center; gap:8px; padding:12px 14px 0; }
.demo-eyebrow{ font-family:var(--font-primary); font-size:9.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
.demo-x{ margin-left:auto; padding:2px; background:none; border:none; color:var(--faint-2); font-size:15px; line-height:1; cursor:pointer; transition:color 140ms ease, transform 140ms cubic-bezier(0.23,1,0.32,1); }
.demo-x:active{ transform:scale(.9); }
@media (hover:hover) and (pointer:fine){ .demo-x:hover{ color:var(--muted-2); } }
.demo-body{ padding:10px 15px 15px; }
.demo-restate{ margin:0; font-size:14.5px; line-height:1.6; color:var(--text-2); }
.demo-wait{ display:flex; align-items:center; gap:10px; padding:12px 15px 15px; font-size:13px; color:var(--muted-2); }
.demo-spin{ flex:none; width:13px; height:13px; border:2px solid var(--border-3); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
.demo-gaps,.demo-note{ margin:12px 0 0; font-size:11.5px; line-height:1.5; color:var(--muted-2); }
.demo-note{ color:var(--faint); }
.demo-hint{ transition:opacity 200ms ease; }
@media (prefers-reduced-motion:reduce){
  .demo-pill,.demo-panel{ animation:none; }
  .demo-pill:active,.demo-x:active{ transform:translateX(-50%); }
}
@media (max-width:520px){ .demo-panel{ width:min(340px, calc(100vw - 32px)); } }

/* Visually hidden but read aloud — the Decode page's h1 already carries the
   visible label, so a second one on screen would be redundant. */
.tab-short{ display:none; }
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@keyframes spin{to{transform:rotate(360deg)}}

  .card{position:relative;animation:cardin .5s cubic-bezier(.2,.75,.3,1) both;transition:transform .18s cubic-bezier(.2,.75,.3,1),box-shadow .18s,border-color .18s;content-visibility:auto;contain-intrinsic-size:auto 160px}
  .card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(20,24,33,.06);border-color:var(--border-strong)}
  .card .go{position:absolute;right:16px;bottom:15px;opacity:0;transform:translateX(-5px);transition:opacity .2s,transform .2s;color:var(--accent);font-size:16px}
  .card:hover .go{opacity:1;transform:translateX(0)}
  .srow{transition:background .13s}
  .srow:hover{background:var(--hover)}
  .srow .ret{color:transparent}
  .srow.on{background:var(--hover);border-left-color:var(--accent)}
  .srow.on .ret{color:var(--accent)}
  .pulse{position:relative;border-radius:20px}
  .pulse::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(240,150,55,.35);animation:pulsering 2.6s ease-in-out infinite}
  .mstack>*{animation:sl .5s cubic-bezier(.2,.75,.3,1) both}

  .mstack>*:nth-child(2){animation-delay:.1s}
  .mstack>*:nth-child(3){animation-delay:.16s}
  .mstack.still>*{animation:none}

  .hero-line{animation:heroin .6s cubic-bezier(.2,.75,.3,1) both}

  .tabu{transition:transform .32s cubic-bezier(.4,1.1,.3,1)}

  .jterm:hover{background:var(--hover)}
  .popclose:hover{color:var(--muted-2)}
  .rm:hover{color:var(--error)}
  .ext-cta:hover{opacity:1;box-shadow:0 4px 16px rgba(79,119,166,.38)}

  .dm-shell{
    --bg:#fdfdfc;--surface:#ffffff;--surface-2:#fbfbfc;--surface-3:#f7f7f8;--hover:#eef1f6;--hover-strong:#ebecef;--header-bg:rgba(253,253,252,0.82);
    --text:#0e0f12;--text-2:#22252b;--text-3:#3f4249;--text-4:#4a4e55;--muted:#6a6e75;--muted-2:#787c83;--faint:#9a9ea5;--faint-2:#c6c9ce;
    --border:rgba(20,24,33,0.10);--border-2:rgba(20,24,33,0.14);--border-3:rgba(20,24,33,0.18);--border-strong:rgba(20,24,33,0.30);--hairline:rgba(20,24,33,0.06);--hairline-2:rgba(20,24,33,0.08);
    --save-text:#4a7c59;--toast-bg:#17181b;--toast-text:#ffffff;--error:#ff0052;--secondary:#f09637;
    --hint-border:1px dotted rgba(20,24,33,.38);
    --shadow-soft:rgba(20,18,14,0.16);--shadow-strong:rgba(20,18,14,0.20);
    transition:background .3s ease,color .3s ease;
  }
  .dm-shell[data-theme="dark"]{
    --bg:#131519;--surface:#1c1f25;--surface-2:#191c21;--surface-3:#23272e;--hover:#2b3038;--hover-strong:#333944;--header-bg:rgba(19,21,25,0.82);
    --text:#f4f5f7;--text-2:#e6e8ec;--text-3:#c6cad1;--text-4:#b2b7bf;--muted:#969ba3;--muted-2:#858a92;--faint:#6d727a;--faint-2:#565b63;
    --border:rgba(255,255,255,0.12);--border-2:rgba(255,255,255,0.17);--border-3:rgba(255,255,255,0.22);--border-strong:rgba(255,255,255,0.34);--hairline:rgba(255,255,255,0.07);--hairline-2:rgba(255,255,255,0.10);
    --save-text:oklch(0.82 0.1 150);--toast-bg:#f4f5f7;--toast-text:#131519;

  /* status colors — swap purely via CSS on theme change */
  .st-core{--stc:oklch(0.5 0.085 155);--stbg:oklch(0.955 0.03 155)}
  .st-rising{--stc:oklch(0.56 0.12 55);--stbg:oklch(0.955 0.05 72)}
  .st-fading{--stc:oklch(0.55 0.05 250);--stbg:oklch(0.955 0.022 250)}
  .st-historical{--stc:oklch(0.5 0 0);--stbg:oklch(0.925 0 0)}
  [data-theme="dark"] .st-core{--stc:oklch(0.82 0.11 155);--stbg:oklch(0.33 0.05 155)}
  [data-theme="dark"] .st-rising{--stc:oklch(0.83 0.12 68);--stbg:oklch(0.35 0.06 60)}
  [data-theme="dark"] .st-fading{--stc:oklch(0.82 0.07 250);--stbg:oklch(0.33 0.04 250)}
  [data-theme="dark"] .st-historical{--stc:oklch(0.78 0 0);--stbg:oklch(0.34 0 0)}
  .badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-primary);font-weight:600;text-transform:uppercase;border-radius:20px;color:var(--stc);background:var(--stbg)}

  .savebtn{border:1px solid var(--accent);border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:8px;transition:background .2s,color .2s,border-color .2s}
  .savebtn.is-saved{background:#eef4ee;color:#4a7c59;border-color:#cfe0cf}
  [data-theme="dark"] .savebtn.is-saved{background:oklch(0.30 0.045 150);color:oklch(0.85 0.1 150);border-color:oklch(0.42 0.05 150)}

  ::selection{background:var(--hover);color:var(--text)}

  /* ---------- polish pass (Emil): press feedback, interruptible collapse, touch/reduced-motion ---------- */
  button{ -webkit-tap-highlight-color:transparent; }
  button:active{ transform:scale(0.98); }
  /* "Go deeper" accordion — height animated via the Web Animations API (see toggleDeeper), fade via CSS */
  .deeper-wrap{ height:0; overflow:hidden; }
  .deeper-inner{ min-height:0; transition:opacity .18s ease; }
  /* Gate hover states to real pointers so taps don't leave sticky states on touch devices */
  @media (hover:none){
    .card:hover{ transform:none; box-shadow:none; border-color:var(--border); }
    .card:hover .go{ opacity:0; }
    .srow:hover{ background:transparent; }
  }
  @media (prefers-reduced-motion: reduce){

  }

</style>

<!-- Cloud bridge: sets up Supabase (if configured) and talks to the app via events. -->
<script type="module">
  const cfg = window.DECODER_CONFIG || {};
  function emit(detail){ window.dispatchEvent(new CustomEvent("decoder-auth", { detail })); }
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) {
    window.__decoderConfigured = false;
    emit({ configured: false });
  } else try {
    window.__decoderConfigured = true;
    const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
    const sb = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    const api = {
      signIn: () => sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.href.split("#")[0] } }),
      signOut: () => sb.auth.signOut(),
      async list() {
        const { data, error } = await sb.from("cheatsheet_items").select("concept_id");
        if (error) { console.warn("[decoder] list failed", error.message); return []; }
        return data.map(r => r.concept_id);
      },
      async add(uid, id) { await sb.from("cheatsheet_items").upsert({ user_id: uid, concept_id: id }); },
      async remove(id) { await sb.from("cheatsheet_items").delete().eq("concept_id", id); },
    };
    window.__decoderCloud = api;
    sb.auth.onAuthStateChange((_evt, session) => {
      emit({ configured: true, user: session ? { id: session.user.id, email: session.user.email } : null, api });
    });
    const { data: { session } } = await sb.auth.getSession();
    emit({ configured: true, user: session ? { id: session.user.id, email: session.user.email } : null, api });
  } catch (e) {
    // supabase-js failed to load (network hiccup, blocked CDN, etc.)
    console.warn("[decoder] cloud bridge failed to load", e);
    window.__decoderCloudError = true;
    emit({ configured: true, loadError: true });
  }
</script>

<script>
"use strict";
const ACCENT = "#4f77a6";
const SHOW_HINTS = true;

const statusMeta = {
  Core:       { label:"Core",       sym:"●", cls:"st-core" },

async function loadShelfFromDB(){

      all.push(...rows);
      if(rows.length < 1000) break;
    }
  }catch(e){ return; }
  if(!all.length) return;
  const dbIds = new Set(all.map(r => r.id));
  const staticOnly = DATA.filter(c => !dbIds.has(c.id));
  DATA.length = 0;
  for(const r of all){
    DATA.push(rowToConcept(r));
    if(r.lens_pm || r.lens_eng) LENSES[r.id] = { pm:r.lens_pm||'', eng:r.lens_eng||'' };

  for(const c of staticOnly) DATA.push(c);

function renderDecode() {
  // Same page furniture as renderSheet(): eyebrow, display h1, standfirst, then the
  // body. A tab should look like the other tabs.
  const head = `
    <div style="max-width:640px;margin-bottom:44px">
      <div style="font-family:var(--font-primary);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px">Decode</div>
      <h1 class="dsp" style="font-weight:600;font-size:clamp(34px,5vw,54px);line-height:1.02;letter-spacing:-.035em;margin:0 0 14px;color:var(--text)">A sentence, in plain English.</h1>
      <p style="font-size:16px;line-height:1.55;color:var(--text-3);margin:0">Paste a sentence that isn't landing. You get the plain version, every shelf term in it linked, and anything the shelf doesn't cover named.</p>
    </div>`;
  const len = explainState.sentence.length;
  const busy = explainState.loading;
  const body = `
    <div style="max-width:640px">
      <label for="explainInput" class="sr-only">Sentence to decode</label>
      <textarea id="explainInput" rows="3" aria-describedby="explainCount" placeholder="e.g. We reduced hallucination by tightening the retriever's top-k and reranking before the context is assembled." style="width:100%;box-sizing:border-box;resize:vertical;min-height:96px;font-family:inherit;font-size:15px;line-height:1.6;color:var(--text);background:var(--surface);border:1px solid var(--border-2);border-radius:12px;padding:14px 16px">${esc(explainState.sentence)}</textarea>
      <div style="display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap">
        <button id="explainBtn" data-decode type="button" ${busy ? 'disabled aria-disabled="true"' : ''} class="h-decode" style="display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:600;cursor:${busy ? 'default' : 'pointer'};opacity:${busy ? '.6' : '1'};transition:transform 160ms cubic-bezier(0.23,1,0.32,1),opacity 160ms ease">${busy ? 'Decoding…' : 'Decode'}</button>
        <span id="explainCount" style="font-size:12px;color:${explainCountColor(len)}">${len} / ${EXPLAIN_MAX}</span>
        <span style="margin-left:auto;font-size:11px;color:var(--faint)">⌘Enter to decode</span>
      </div>
      <div id="explainResult" aria-live="polite" aria-atomic="true"></div>
    </div>`;
  $("#s-decode").innerHTML = `<div class="sheet-pad" style="padding:76px 0 96px">${head}${body}</div>`;
  wireExplain();
}

function wireExplain() {
  const ta = $("#explainInput");
  if (!ta) return;
  ta.addEventListener('input', e => {
    explainState.sentence = e.target.value;
    const cnt = $("#explainCount");
    if (cnt) { cnt.textContent = explainState.sentence.length + ' / ' + EXPLAIN_MAX; cnt.style.color = explainCountColor(explainState.sentence.length); }
  });
  ta.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); submitExplain(); }
  });
  if (explainState.result) renderExplainResult(explainState.result); // restore across a background re-render
}

function reflectExplainBusy() {
  const btn = $("#explainBtn");
  if (btn) {
    btn.disabled = explainState.loading;
    btn.setAttribute('aria-disabled', String(explainState.loading));
    btn.style.opacity = explainState.loading ? '.6' : '1';
    btn.style.cursor = explainState.loading ? 'default' : 'pointer';
    btn.textContent = explainState.loading ? 'Decoding…' : 'Decode';
  }
}

let explainWaitTimer1 = null, explainWaitTimer2 = null;
function setExplainResult(payload) {
  if (!payload || payload.state !== 'loading') { clearTimeout(explainWaitTimer1); clearTimeout(explainWaitTimer2); }
  explainState.result = payload; renderExplainResult(payload);
}
function renderExplainResult(opts) {
  const el = $("#explainResult");
  if (!el) return;
  if (!opts) { el.innerHTML = ''; return; }
  if (opts.state === 'loading') {
    el.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:16px 2px 2px;color:var(--muted-2);font-size:13.5px">
      <span aria-hidden="true" style="width:13px;height:13px;border-radius:50%;border:2px solid var(--border-3);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:none"></span>
      <span id="explainWait">Decoding…</span>
    </div>`;
    // A silent spinner past a few seconds reads as hung. Cold starts on the
    // serverless function are genuinely slow (the shelf index has to be parsed),
    // so say so rather than leaving the reader guessing.
    clearTimeout(explainWaitTimer1); clearTimeout(explainWaitTimer2);
    explainWaitTimer1 = setTimeout(() => { const w = $("#explainWait"); if (w) w.textContent = 'Decoding… first one after a while takes longer'; }, 4000);
    explainWaitTimer2 = setTimeout(() => { const w = $("#explainWait"); if (w) w.textContent = 'Still going — waking the decoder up'; }, 12000);
  } else if (opts.state === 'error') {
    el.innerHTML = `<p role="alert" style="margin:16px 0 0;color:var(--text-3);font-size:13.5px;line-height:1.55">${esc(opts.message)}</p>`;
  } else if (opts.state === 'success') {
    const chips = opts.terms.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">${opts.terms.map(t => `<button class="rel" data-openrow="${escAttr(t.card_id)}" style="display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);border:1px solid var(--hairline-2);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer">${esc(t.surface)}<span style="color:var(--accent)">→</span></button>`).join('')}</div>` : '';
    const gapsLine = opts.gaps.length ? `<p style="margin:14px 0 0;font-size:12.5px;line-height:1.55;color:var(--muted-2)">Not on the shelf yet: ${opts.gaps.map(esc).join(', ')}.</p>` : '';
    el.innerHTML = `<div class="explain-answer" style="margin-top:26px;padding-top:22px;border-top:1px solid var(--border)">
      <p style="margin:0;font-size:17px;line-height:1.62;color:var(--text)">${esc(opts.restatement)}</p>
      ${chips}${gapsLine}
    </div>`;
  } else {
    el.innerHTML = '';
  }
}

async function submitExplain() {
  if (explainState.loading) return;
  const sentence = (explainState.sentence || '').trim();
  if (!sentence) { setExplainResult({ state: 'error', message: 'Paste a sentence first.' }); return; }
  if (sentence.length > EXPLAIN_MAX) { setExplainResult({ state: 'error', message: `That’s over ${EXPLAIN_MAX} characters — trim it and try again.` }); return; }
  explainState.loading = true; reflectExplainBusy();
  setExplainResult({ state: 'loading' });
  let res;
  // Bound the wait. Without this a stalled request spins indefinitely, which is
  // indistinguishable from a broken page. 45s is past the worst measured cold start.
  const ctl = new AbortController();
  const abortTimer = setTimeout(() => ctl.abort(), 45000);
  try {
    res = await fetch('/api/explain', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sentence }), signal: ctl.signal });
  } catch (e) {
    clearTimeout(abortTimer);
    explainState.loading = false; reflectExplainBusy();
    setExplainResult({ state: 'error', message: e && e.name === 'AbortError'
      ? 'That took too long. Try again — the second one is usually quick.'
      : 'Couldn’t reach the decoder. Check your connection and try again.' });
    return;
  }
  clearTimeout(abortTimer);
  let body = null, parseFailed = false;
  try { body = await res.json(); } catch (e) { parseFailed = true; }
  explainState.loading = false; reflectExplainBusy();
  if (!res.ok) {
    // web/api/explain.js's error shape is { error: <machine code>, message?: <human text> } —
    // prefer message; error alone (e.g. "method_not_allowed") is not reader-facing copy.
    const serverMsg = body && typeof body.message === 'string' ? body.message : '';
    const msg = serverMsg || (res.status >= 500 ? 'Something went wrong on this end. Try again in a moment.' : 'Couldn’t decode that sentence. Try again.');
    setExplainResult({ state: 'error', message: msg });
    return;
  }
  const valid = !parseFailed && body && typeof body.restatement === 'string' && Array.isArray(body.terms) && Array.isArray(body.gaps);
  if (!valid) { setExplainResult({ state: 'error', message: 'Got a response that didn’t make sense. Try again.' }); return; }
  const terms = body.terms.filter(t => t && typeof t.card_id === 'string' && t.card_id && typeof t.surface === 'string' && t.surface);
  const gaps = body.gaps.filter(g => typeof g === 'string' && g);
  setExplainResult({ state: 'success', restatement: body.restatement, terms, gaps });
}

/* ---------- "How it works": surface 1b, live on a sample article ----------
   This is the extension's surface running on this page — same extraction
   (extract.js, the copy of extension/extract.js), same endpoint, same behaviour:
   highlight a sentence, a Decode button appears, the answer renders in place.
   The point is that a visitor can feel it before installing anything.

   Two differences from the extension, both deliberate:
   - it only listens inside #demoDoc, so selecting the site's own text does nothing;
   - chips reuse this app's card opener (data-openrow), which is what the extension
     does too in its own renderer — never a /term/ URL (D28).

   DEMO_LIMIT is a courtesy cap, not a control: generation costs money and D5
   ships with no rate limit yet (Phase 3). It stops honest over-use on a public
   page and nothing else. */
const DEMO_LIMIT = 8;
let demoUsed = 0;
let demoPill = null, demoPanel = null, demoRange = null, demoRect = null, demoSeq = 0;
let demoWait1 = null, demoWait2 = null, demoSettle = null;

const DEMO_ARTICLE = [
  `Most teams reach for a bigger model when the answers go wrong. In our case the answers were wrong because the context was wrong, and no amount of model changed that.`,
  `We reduced hallucination by tightening the retriever's top-k and reranking before the context is assembled. That single change did more than a month of prompt work.`,
  `Chunking is where the rest of the tuning time went. A chunk that spans two ideas retrieves for both and answers neither.`,
  `Quantization let the model run on one card, and the quality loss was smaller than the latency win. We shipped it the same week.`
];

          <h2 class="dsp" style="font-weight:600;font-size:23px;line-height:1.2;letter-spacing:-.02em;margin:0 0 16px;color:var(--text)">Notes on shipping a retrieval stack</h2>
          ${DEMO_ARTICLE.map(t => `<p>${esc(t)}</p>`).join('')}
        </div>
      </div>
      <p style="font-size:12px;line-height:1.55;color:var(--faint);margin:14px 0 0">Terms are matched on your device. The sentence you press Decode on is the only thing sent — nothing goes anywhere while you're just selecting.</p>

  ].map(([t,d]) => `

    </div>`).join('');

  const cta = `

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:28px">${steps}</div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">

/* ---- the demo surface ---- */
function demoTeardown(){
  clearTimeout(demoSettle); clearTimeout(demoWait1); clearTimeout(demoWait2);
  if(demoPill){ demoPill.remove(); demoPill = null; }
  if(demoPanel){ demoPanel.remove(); demoPanel = null; }
  demoRange = null; demoRect = null;
}

function demoStage(){ return document.getElementById('demoStage'); }

// Rects are viewport-relative; the stage is the positioning context. Converting
// once here keeps every placement in one coordinate system.
function demoPlace(el, rect, gap){
  const stage = demoStage(); if(!stage) return;
  const box = stage.getBoundingClientRect();
  const w = el.offsetWidth || 320, h = el.offsetHeight || 120;
  const lo = w/2 + 8, hi = box.width - w/2 - 8;
  let left = rect.left + rect.width/2 - box.left;
  left = hi < lo ? box.width/2 : Math.min(Math.max(left, lo), hi);
  // Below by default. Flipping up is only worth it when the panel genuinely
  // won't fit under the sentence AND it still lands inside the article card —
  // a panel that escapes the card upwards and covers the page header reads as
  // broken rather than in-place. An unknown viewport height means below.
  const above = rect.top - box.top - h - gap;
  const vh = window.innerHeight || document.documentElement.clientHeight || 0;
  const fitsBelow = !vh || rect.bottom + gap + h <= vh - 8;
  const useAbove = !fitsBelow && above >= 0;
  el.style.left = left + 'px';
  el.style.top = (useAbove ? above : rect.bottom - box.top + gap) + 'px';
  el.setAttribute('data-side', useAbove ? 'above' : 'below');
}

function demoEndRect(range){
  const rects = range.getClientRects();
  return (rects && rects.length) ? rects[rects.length-1] : range.getBoundingClientRect();
}
function demoRectNow(){
  if(demoRange){
    try{ const r = demoRange.getClientRects(); if(r && r.length) return r[r.length-1]; }catch(e){}
  }
  return demoRect;
}

function demoSelection(){
  const doc = document.getElementById('demoDoc');
  const sel = window.getSelection();
  if(!doc || !sel || sel.isCollapsed || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  if(!doc.contains(range.commonAncestorContainer)) return null;   // the demo only, not the site
  const text = sel.toString();
  if(!text.trim()) return null;
  let before = '', after = '';
  try{
    const pre = document.createRange(); pre.selectNodeContents(doc);
    pre.setEnd(range.startContainer, range.startOffset); before = pre.toString();
    const post = document.createRange(); post.selectNodeContents(doc);
    post.setStart(range.endContainer, range.endOffset); after = post.toString();
  }catch(e){}
  if(!window.DecoderExtract) return null;   // extract.js missing: no pill, rather than a throw on every selection
  const prepared = window.DecoderExtract.prepare({ selected:text, before, after });
  if(!prepared.ok) return null;
  return { prepared, range: range.cloneRange(), rect: demoEndRect(range) };
}

function demoHidePill(){ if(demoPill){ demoPill.remove(); demoPill = null; } }

function demoShowPill(found){
  demoHidePill();
  const stage = demoStage(); if(!stage) return;
  demoPill = document.createElement('button');
  demoPill.type = 'button';
  demoPill.className = 'demo-pill';
  demoPill.textContent = 'Decode';
  demoPill.setAttribute('aria-label','Decode this sentence');
  stage.appendChild(demoPill);
  demoPlace(demoPill, found.rect, 8);
  demoPill.addEventListener('mousedown', e => e.preventDefault());   // keep the selection
  demoPill.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); demoRun(found); });
}

function demoPaint(html){
  const stage = demoStage(); if(!stage) return;
  if(!demoPanel){
    demoPanel = document.createElement('div');
    demoPanel.className = 'demo-panel';
    demoPanel.setAttribute('role','dialog');
    demoPanel.setAttribute('aria-label','Decoded sentence');
    demoPanel.setAttribute('aria-live','polite');
    stage.appendChild(demoPanel);
    demoPanel.addEventListener('click', ev => {
      if(ev.target.closest('[data-demo-x]')){ demoClosePanel(); return; }
      // chips fall through to the document handler, which opens the real card
    });
  }
  demoPanel.innerHTML = `<div class="demo-head"><span class="demo-eyebrow">Decode</span><button data-demo-x class="demo-x" aria-label="Close">&times;</button></div>${html}`;
  demoPlace(demoPanel, demoRectNow() || demoRect, 10);
}
function demoClosePanel(){
  clearTimeout(demoWait1); clearTimeout(demoWait2);
  if(demoPanel){ demoPanel.remove(); demoPanel = null; }
  demoRange = null; demoRect = null;
}

function demoRun(found){
  demoHidePill();
  const hint = document.getElementById('demoHint');
  if(hint) hint.style.opacity = '0';

  demoRange = found.range; demoRect = found.rect;

  if(demoUsed >= DEMO_LIMIT){
    demoPaint(`<div class="demo-body"><p class="demo-restate">That's the demo's share of decodes for this visit. The extension does this on whatever you're reading — the button is just below.</p></div>`);
    return;
  }
  demoUsed++;

  const my = ++demoSeq;
  demoPaint(`<div class="demo-wait"><span class="demo-spin" aria-hidden="true"></span><span data-demo-wait>Decoding&hellip;</span></div>`);
  clearTimeout(demoWait1); clearTimeout(demoWait2);
  const setWait = m => { const w = demoPanel && demoPanel.querySelector('[data-demo-wait]'); if(w) w.textContent = m; };
  demoWait1 = setTimeout(() => setWait('Decoding… first one after a while takes longer'), 4000);
  demoWait2 = setTimeout(() => setWait('Still going — waking the decoder up'), 12000);

  const fail = msg => { if(my === demoSeq) demoPaint(`<p class="demo-restate" role="alert" style="padding:10px 15px 15px;font-size:13px;color:var(--text-4)">${esc(msg)}</p>`); };
  const ctl = new AbortController();
  const abortTimer = setTimeout(() => ctl.abort(), 45000);

  fetch('/api/explain', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ sentence: found.prepared.text }), signal: ctl.signal })
    .then(async res => {
      clearTimeout(abortTimer);
      let body = null; try{ body = await res.json(); }catch(e){}
      if(my !== demoSeq) return;
      clearTimeout(demoWait1); clearTimeout(demoWait2);
      if(!res.ok){
        const m = body && typeof body.message === 'string' ? body.message : '';
        return fail(m || (res.status >= 500 ? 'Something went wrong on this end. Try again in a moment.' : 'Couldn’t decode that sentence. Try again.'));
      }
      const valid = body && typeof body.restatement === 'string' && Array.isArray(body.terms) && Array.isArray(body.gaps);
      if(!valid) return fail('Got a response that didn’t make sense. Try again.');
      const terms = body.terms.filter(t => t && typeof t.card_id === 'string' && t.card_id && typeof t.surface === 'string' && t.surface);
      const gaps = body.gaps.filter(g => typeof g === 'string' && g);
      const chips = terms.length
        ? `<div class="explain-answer" style="display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;animation:none">${terms.map(t =>
            `<button class="rel" data-openrow="${escAttr(t.card_id)}" style="display:inline-flex;align-items:center;gap:5px;background:var(--surface-3);border:1px solid var(--hairline-2);border-radius:999px;padding:5px 11px;font-family:var(--font-primary);font-size:12.5px;font-weight:500;color:var(--text-2);cursor:pointer">${esc(t.surface)}<span style="color:var(--accent)">&rarr;</span></button>`
          ).join('')}</div>` : '';
      const gapsLine = gaps.length ? `<p class="demo-gaps">Not on the shelf yet: ${gaps.map(esc).join(', ')}.</p>` : '';
      const p = found.prepared;
      const MAXS = (window.DecoderExtract && window.DecoderExtract.MAX_SENTENCES) || 3;
      const note = p.trimmed
        ? (p.found > MAXS
            ? `Decoded the first ${MAXS} sentences of that selection.`
            : 'Decoded the first part of that selection.')
        : '';
      const noteLine = note ? `<p class="demo-note">${esc(note)}</p>` : '';
      demoPaint(`<div class="demo-body"><p class="demo-restate">${esc(body.restatement)}</p>${chips}${gapsLine}${noteLine}</div>`);
    })
    .catch(e => {
      clearTimeout(abortTimer); clearTimeout(demoWait1); clearTimeout(demoWait2);
      fail(e && e.name === 'AbortError'
        ? 'That took too long. Try again — the second one is usually quick.'
        : 'Couldn’t reach the decoder. Check your connection and try again.');
    });
}

function demoWire(){
  const doc = document.getElementById('demoDoc');
  if(!doc) return;
  const schedule = () => { clearTimeout(demoSettle); demoSettle = setTimeout(() => {
    const found = demoSelection();
    if(!found){ demoHidePill(); return; }
    demoShowPill(found);
  }, 10); };
  doc.addEventListener('mouseup', schedule);
  doc.addEventListener('keyup', e => { if(e.shiftKey || /^(Arrow|Home|End|Page)/.test(e.key)) schedule(); });
}

// Document-level, registered once: the demo's own nodes are rebuilt on every
// tab switch, so listeners bound to them would leak.
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if(demoPill && (!sel || sel.isCollapsed)) demoHidePill();
});
document.addEventListener('mousedown', e => {
  if(!demoPill && !demoPanel) return;
  if(e.target.closest && e.target.closest('.demo-pill, .demo-panel')) return;
  demoHidePill();
  if(demoPanel && !(e.target.closest && e.target.closest('#demoDoc'))) demoClosePanel();
}, true);
window.addEventListener('resize', () => {
  demoHidePill();
  const r = demoRectNow();
  if(demoPanel && r) demoPlace(demoPanel, r, 10);
});

/* ---------- surface 2: saved terms ---------- */
function nudgeFor(c){
  if(c.status==='Fading') return 'This term is fading. Worth recognizing, not worth relying on.';
  if(c.status==='Historical') return 'Mostly historical now. Useful to recognize, not in active use.';
  return null;
}
function renderSheet(){

/* ---------- spotlight ---------- */
const SPOT_MAX = 60; // cap rendered rows — full result set can be 1000+; selection never rebuilds the list
function renderSpotResults(){
  const box = $("#spotResults"); if(!box) return;
  const results = getResults();
  const capped = Math.min(results.length, SPOT_MAX);
  if(state.selIndex > capped-1) state.selIndex = Math.max(capped-1,0);
  if(results.length === 0){
    box.innerHTML = `<div style="padding:34px 20px;text-align:center;color:var(--muted-2);font-size:14px;line-height:1.5">No match. It might be too new to have a card yet.</div>`;
  } else {
    const shown = results.slice(0, SPOT_MAX);
    const rows = shown.map((c,i) => {
      const active = i === state.selIndex;
      return `<button class="srow${active?' on':''}" data-openrow="${c.id}" data-idx="${i}" style="width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--hairline);border-left:2px solid transparent;cursor:pointer;padding:12px 18px 12px 16px;display:flex;align-items:center;gap:12px">
        <span class="dsp" style="flex:none;font-weight:600;font-size:15px;letter-spacing:-.01em">${esc(c.term)}</span>
        <span style="flex:1;font-size:13px;color:var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.oneLiner)}</span>
        <span class="ret" style="flex:none;font-size:11px">↵</span>
      </button>`;
    }).join('');
    const more = results.length > SPOT_MAX ? `<div style="padding:10px 18px;font-size:12px;color:var(--faint)">${results.length - SPOT_MAX} more — keep typing to narrow</div>` : '';
    box.innerHTML = rows + more;
  }
  const cnt = $("#spotCount");
  if(cnt) cnt.textContent = results.length > SPOT_MAX ? `${capped} of ${results.length}` : `${results.length} shown`;
  const activeEl = box.querySelector('.srow[data-idx="'+state.selIndex+'"]');
  if(activeEl) activeEl.scrollIntoView({block:'nearest'});
}
// Selection-only update: toggles .on between rows without touching innerHTML (full rebuild only on query change).
function setSpotSel(idx){
  const box = $("#spotResults"); if(!box) return;
  const old = box.querySelector('.srow.on'); if(old) old.classList.remove('on');
  const next = box.querySelector('.srow[data-idx="'+idx+'"]');
  if(next){ next.classList.add('on'); next.scrollIntoView({block:'nearest'}); }
  state.selIndex = idx;
}

function openSpotlight(){ state.spotlightOpen = true; state.query = ''; state.selIndex = 0; state.remoteResults = []; renderSpotlight(); }
function toggleSpotlight(){ state.spotlightOpen ? (state.spotlightOpen=false, renderSpotlight()) : openSpotlight(); }
function escapeAll(){ state.spotlightOpen=false; state.openId=null; state.sel=null; demoHidePill(); demoClosePanel(); renderSpotlight(); renderModal(false); renderPopover(); closeSignin(); }

function openCard(id){ state.openId = id; state.deeperOpen = false; state.spotlightOpen = false; state.sel = null; renderSpotlight(); renderPopover(); renderModal(true); }
function closeCard(){ state.openId = null; renderModal(false); }
function toggleDeeper(){
  state.deeperOpen = !state.deeperOpen;
  const isOpen = state.deeperOpen;
  const wrap = document.querySelector('#modalRoot .deeper-wrap');
  const inner = wrap && wrap.querySelector('.deeper-inner');
  const btn = document.querySelector('#modalRoot [data-deeper]');
  if(btn){
    const spans = btn.querySelectorAll('span');
    if(spans[0]) spans[0].textContent = isOpen ? '−' : '+';
    if(spans[1]) spans[1].textContent = isOpen ? 'Hide details' : 'Go deeper';
  }
  if(!wrap || !inner) return;
  inner.style.opacity = isOpen ? '1' : '0';          // CSS-transition fade
  const start = wrap.getBoundingClientRect().height; // visual height (mid-anim if interrupted)
  if(wrap._anim) wrap._anim.cancel();
  wrap.style.height = 'auto';
  const full = wrap.getBoundingClientRect().height;  // measure target
  wrap.style.height = isOpen ? 'auto' : '0';         // rest value the element settles to
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;
  // Animate only the height, from the current visual height to the target. Interruptible, no fill
  // (so it settles to the inline rest value above with no snap).
  const anim = wrap.animate(
    [{ height: start + 'px' }, { height: (isOpen ? full : 0) + 'px' }],
    { duration: isOpen ? 260 : 190, easing: 'cubic-bezier(.32,.72,0,1)' }
  );
  wrap._anim = anim;
  anim.onfinish = anim.oncancel = () => { if(wrap._anim === anim) wrap._anim = null; };
}
let lensTimer = null;
function setLens(k){
  if(state.lens === k) return;
  state.lens = k;
  try { localStorage.setItem('decoder.lens.v1', k); } catch (e) {}
  // patch in place — no modal rebuild, so nothing flickers
  document.querySelectorAll('#modalRoot [data-lens]').forEach(b => b.setAttribute('style', lensBtnStyle(b.getAttribute('data-lens') === k)));
  const p = document.getElementById('lensLine');
  if(p && state.openId){
    const line = lensLineFor(find(state.openId), k);
    p.style.opacity = '0';
    clearTimeout(lensTimer);
    lensTimer = setTimeout(() => { p.textContent = line; p.style.opacity = '1'; }, 140);
  }
}

function updateGridFlags(){
  document.querySelectorAll('[data-flag]').forEach(el => {
    if(!isSignedIn()){ el.style.display='none'; return; }
    el.style.display = isSaved(el.getAttribute('data-flag')) ? 'inline' : 'none';
  });
}
function afterSaveChange(){ persist(); renderTabs(); updateGridFlags(); if(state.tab==='sheet') renderSheet(); renderModal(false); renderPopover(); }

function toggleSave(id){
  if(!id) return;
  if(!isSignedIn()){ requireAuth(); return; }
  const has = isSaved(id);
  state.saved = has ? state.saved.filter(x => x !== id) : [...state.saved, id];
  cloudSync(id, !has);
  showToast(has ? 'Removed' : 'Saved');
  afterSaveChange();
}

function closePopover(){ state.sel = null; renderPopover(); }
function savePopover(){
  const id = state.sel && state.sel.id; if(!id) return;
  if(!isSignedIn()){ requireAuth(); return; }
  if(!isSaved(id)){ state.saved = [...state.saved, id]; cloudSync(id, true); }
  state.selSaved = true; showToast('Saved'); afterSaveChange();
}
function removePopover(){
  const id = state.sel && state.sel.id; if(!id) return;
  state.saved = state.saved.filter(x => x !== id); cloudSync(id, false);
  state.selSaved = false; showToast('Removed'); afterSaveChange();
}
function openSelFull(){ const id = state.sel && state.sel.id; if(id) openCard(id); }

function toggleTheme(){
  state.dark = !state.dark;
  shell.setAttribute('data-theme', state.dark ? 'dark' : 'light');
  const b = $("#themeBtn");
  b.textContent = state.dark ? '☀' : '☾';
  const title = state.dark ? 'Switch to light' : 'Switch to dark';
  b.title = title; b.setAttribute('aria-label', title);
}

/* ---------- global event wiring ---------- */
function spotlightNav(e){
  const r = getResults();
  const capped = Math.min(r.length, SPOT_MAX); // never navigate past the rendered (sliced) rows
  if(e.key === 'ArrowDown'){ e.preventDefault(); setSpotSel(Math.min(state.selIndex+1, Math.max(capped-1,0))); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); setSpotSel(Math.max(state.selIndex-1, 0)); }
  else if(e.key === 'Enter'){ e.preventDefault(); const c = r[state.selIndex] || r[0]; if(c) openRow(c.id); }
}
window.addEventListener('keydown', e => {
  const k = e.key;
  const typing = /^(input|textarea)$/i.test((e.target && e.target.tagName) || '');
  if((e.metaKey || e.ctrlKey) && (k === 'k' || k === 'K')){ e.preventDefault(); toggleSpotlight(); return; }
  if(k === 'Escape'){ escapeAll(); return; }
  if(k === '/' && !state.spotlightOpen && !typing){ e.preventDefault(); openSpotlight(); return; }
  if(state.spotlightOpen) spotlightNav(e);
});

// delegated clicks
document.addEventListener('click', e => {
  const t = e.target;
  const tabBtn = t.closest('[data-tab]'); if(tabBtn){ setTab(tabBtn.getAttribute('data-tab')); return; }
  if(t.closest('[data-openspot]')){ openSpotlight(); return; }
  const openBtn = t.closest('[data-open]'); if(openBtn){ openCard(openBtn.getAttribute('data-open')); return; }
  const rowBtn = t.closest('[data-openrow]'); if(rowBtn){ openRow(rowBtn.getAttribute('data-openrow')); return; }
  const rmBtn = t.closest('[data-remove]'); if(rmBtn){ toggleSave(rmBtn.getAttribute('data-remove')); return; }
  if(t.closest('[data-close-modal]')){ closeCard(); return; }
  if(t.closest('[data-deeper]')){ toggleDeeper(); return; }
  const lensBtn = t.closest('[data-lens]'); if(lensBtn){ setLens(lensBtn.getAttribute('data-lens')); return; }
  if(t.closest('[data-savemodal]')){ toggleSave(state.openId); return; }
  if(t.closest('[data-closepop]')){ closePopover(); return; }
  if(t.closest('[data-savepop]')){ savePopover(); return; }
  if(t.closest('[data-removepop]')){ removePopover(); return; }
  if(t.closest('[data-openfull]')){ openSelFull(); return; }
  if(t.closest('[data-close-signin]')){ closeSignin(); return; }
  if(t.closest('[data-signin]')){ doSignIn(); return; }
  if(t.closest('[data-signout]')){ cloud.api && cloud.api.signOut(); return; }
  if(t.closest('[data-decode]')){ submitExplain(); return; }
});
$("#searchBtn").addEventListener('click', openSpotlight);
$("#themeBtn").addEventListener('click', toggleTheme);
// backdrop mousedown close (matches prototype onMouseDown)
document.addEventListener('mousedown', e => {
  const bd = e.target.closest && e.target.closest('[data-backdrop]');
  if(bd && e.target === bd) escapeAll();
});
// reposition popover on scroll/resize by dismissing (keeps it anchored honestly)
window.addEventListener('scroll', () => { if(state.sel) closePopover(); }, true);

/* ---------- init ---------- */
renderTabs();
renderLookup();
renderSheet();
renderAuth();
loadShelfFromDB();
// aidecoder.app/#how-it-works — the one linkable tab (store listing, extension popup).
if(location.hash === '#how-it-works') setTab('how');
window.addEventListener('hashchange', () => {
  if(location.hash === '#how-it-works' && state.tab !== 'how') setTab('how');
});
</script>
</body>
